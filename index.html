<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camino al Sí 💍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff0f3; --card:#ffffff; --ink:#3b1f2b; --muted:#8a5d6f; --rose:#e8436e; --rose-dk:#b52b52;
  --gold:#f2b632; --btn:#ffe1e8; --line:#f3bfcd;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1e1118;--card:#2b1922;--ink:#fbe8ee;--muted:#cfa2b3;--rose:#ff5a86;--rose-dk:#c23a62;--btn:#3a2230;--line:#51303f;}
}
:root[data-theme="dark"]{--bg:#1e1118;--card:#2b1922;--ink:#fbe8ee;--muted:#cfa2b3;--rose:#ff5a86;--rose-dk:#c23a62;--btn:#3a2230;--line:#51303f;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Baloo 2',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:900px;height:100%;display:flex;flex-direction:column;padding:8px 12px;gap:8px}
.hud{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;line-height:1.1}
.hud .lvl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .pill{background:var(--btn);padding:4px 10px;border-radius:99px;white-space:nowrap}
.hud button{border:none;background:var(--btn);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:18px;box-shadow:0 10px 30px rgba(180,40,90,.18);touch-action:none;background:#bfe3ff;max-width:100%}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 4px 6px}
.pad{display:flex;gap:14px}
.cbtn{width:76px;height:76px;border-radius:50%;border:none;background:var(--btn);color:var(--rose);font:800 28px 'Baloo 2',system-ui,sans-serif;touch-action:none;box-shadow:0 5px 0 var(--line);cursor:pointer}
.cbtn.jump{width:120px;border-radius:40px;font-size:20px;background:var(--rose);color:#fff;box-shadow:0 5px 0 var(--rose-dk)}
.cbtn.on{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.cbtn.jump.on{box-shadow:0 1px 0 var(--rose-dk)}
.keyhint{display:none;text-align:center;color:var(--muted);font-size:14px;padding-bottom:6px}
@media (hover:hover) and (pointer:fine){.controls{display:none}.keyhint{display:block}}
body.noplay .controls{visibility:hidden}

.ov{position:fixed;inset:0;display:none;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));
  background:rgba(45,10,28,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;overflow-y:auto}
.ov.show{display:flex}
.card{background:var(--card);border-radius:26px;padding:24px 20px 20px;max-width:430px;width:100%;margin:auto;text-align:center;box-shadow:0 24px 60px rgba(120,20,60,.3)}
.ov.bottom{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
.ov.bottom .card{pointer-events:auto;margin:auto auto 0}
h1{font-size:40px;line-height:1;margin:0 0 6px;color:var(--rose);font-weight:800;letter-spacing:-.5px}
h2{font-size:26px;line-height:1.1;margin:4px 0 10px;font-weight:800}
p{margin:0 0 14px;line-height:1.35;font-size:17px}
.sub{color:var(--muted)}
.tag{display:inline-block;background:var(--btn);color:var(--rose);font-weight:700;border-radius:99px;padding:2px 12px;font-size:14px}
.quote{font-size:19px;font-weight:600}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 16px}
.who{background:var(--bg);border-radius:20px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.face{width:84px;height:84px;border-radius:50%;background:var(--btn) center/cover no-repeat;display:grid;place-items:center;font-size:44px;border:3px solid var(--card);box-shadow:0 0 0 3px var(--rose)}
.lab{font-weight:800;font-size:15px}
.who input[type=text]{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 8px;font:600 16px 'Baloo 2',system-ui,sans-serif;text-align:center}
.who input[type=text]:focus{outline:none;border-color:var(--rose)}
.upl{background:var(--rose);color:#fff;border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer}
.link{background:none;border:none;color:var(--muted);font:600 13px 'Baloo 2',system-ui,sans-serif;text-decoration:underline;cursor:pointer;padding:0}
.big{border:none;background:var(--rose);color:#fff;font:800 20px 'Baloo 2',system-ui,sans-serif;padding:12px 26px;border-radius:99px;box-shadow:0 5px 0 var(--rose-dk);cursor:pointer}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rose-dk)}
.ghost{border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 17px 'Baloo 2',system-ui,sans-serif;padding:9px 20px;border-radius:99px;cursor:pointer;transition:transform .25s ease}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;position:relative}
.hint{font-size:14px;color:var(--muted);margin:14px 0 0}
button:focus-visible,.upl:focus-within{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body class="noplay">
<div class="app">
  <div class="hud">
    <span class="lvl" id="lvl">Camino al Sí</span>
    <span class="pill" id="hc">❤️ 0</span>
    <span class="pill" id="tr">💥 0</span>
    <button id="snd" aria-label="Sonido">🔊</button>
    <button id="home" aria-label="Menú">🏠</button>
  </div>
  <div class="stage" id="stage"><canvas id="game" width="960" height="768"></canvas></div>
  <div class="controls">
    <div class="pad">
      <button class="cbtn" data-k="left" aria-label="Izquierda">◀</button>
      <button class="cbtn" data-k="right" aria-label="Derecha">▶</button>
    </div>
    <button class="cbtn jump" data-k="jump">Saltar</button>
  </div>
  <div class="keyhint">Flechas o A/D para moverte · Espacio para saltar</div>
</div>
<div class="ov" id="ov"><div class="card" id="card"></div></div>

let AC=null, muted=false;
function beep(f,d,type='square',v=.05,slide=0){ if(muted)return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime; o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d);}catch(e){} }

/* música de boda (Wagner y Mendelssohn, dominio público) */
function ensureAC(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function freq(n){const m=/^([A-G])(#|b)?(\d)$/.exec(n);const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,(b+(+m[3]+1)*12-69)/12);}
function parseSong(str){const ev=str.trim().split(/\s+/).map(x=>{const[a,b,c]=x.split(':');return{n:a,b:+b,bass:c||null}});
  for(let i=0;i<ev.length;i++)if(ev[i].bass){let d=0;for(let j=i;j<ev.length;j++){if(j>i&&ev[j].bass)break;d+=ev[j].b;}ev[i].bd=d;}return ev;}
const BA='G4:1:C3 C5:1.5:C3 C5:.5 C5:2:E3 G4:1:G2 D5:1.5:G2 B4:.5 C5:2:C3';
const BB='G4:1:C3 C5:1.5:F2 F5:.5 F5:1 E5:1 D5:1.5:G2 C5:.5 B4:1 C5:1 D5:3:G2';
const BE='G4:1:C3 C5:1.5:A2 E5:.5 G5:1:C3 E5:1 C5:1.5:F2 A4:.5 B4:1:G2 D5:1 C5:3:C3 R:1';
const BRIDAL=[BA,BB,BA,BE].join(' ');
const FANFARE='G4:.33:C3 G4:.33 G4:.34 G4:1.5 R:.5 G4:.33:C3 G4:.33 G4:.34 G4:1.5 R:.5 G4:.33:G2 G4:.33 G4:.34 G4:.5 G4:.33 G4:.33 G4:.34 G4:.5 G4:.33 G4:.33 G4:.34 G4:.5 C5:3:C3 R:1 ';
let music=null;
function tone(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.setValueAtTime(v,t+Math.max(.03,d-.08));g.gain.linearRampToValueAtTime(0,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);}
function playMusic(str,bpm,loopFrom=0){stopMusic();if(!ensureAC())return;
  music={ev:parseSong(str),bpm,loopFrom,i:0,next:AC.currentTime+.15};music.timer=setInterval(tickMusic,40);}
function stopMusic(){if(music){clearInterval(music.timer);music=null;}}
function tickMusic(){if(!music)return;const spb=60/music.bpm;
  while(music.next<AC.currentTime+.25){const e=music.ev[music.i],d=e.b*spb;
    if(!muted){ if(e.n!=='R'){tone(freq(e.n),music.next,d*.92,'triangle',.055);tone(freq(e.n)*2,music.next,d*.92,'sine',.015);}
      if(e.bass){tone(freq(e.bass),music.next,e.bd*spb*.95,'sine',.07);tone(freq(e.bass)*1.5,music.next,e.bd*spb*.95,'sine',.02);} }
    music.next+=d; if(++music.i>=music.ev.length)music.i=music.loopFrom;}}

function build(w,s){
  const g=Array.from({length:H},()=>Array(w).fill(' '));
  for(let x=0;x<w;x++)g[11][x]='#';
  (s.gaps||[]).forEach(([a,b])=>{for(let x=a;x<=b;x++)g[11][x]=' '});
  (s.block||[]).forEach(([x,y,bw,bh])=>{for(let j=0;j<bh;j++)for(let i=0;i<bw;i++)g[y+j][x+i]='#'});
  (s.plat||[]).forEach(([x,y,l])=>{for(let i=0;i<l;i++)g[y][x+i]='='});
  (s.spike||[]).forEach(([x,y,l])=>{for(let i=0;i<l;i++)g[y][x+i]='^'});
  (s.heart||[]).forEach(([x,y])=>g[y][x]='o');
  (s.enemy||[]).forEach(([x,y])=>g[y][x]='E');
  g[10][1]='P'; if(s.flag!=null)g[10][s.flag]='F'; if(s.girl!=null)g[10][s.girl]='G';
  return g;
}

/* ---------- física ---------- */
function tile(tx,ty){ if(tx<0||tx>=W)return '#'; if(ty<0||ty>=H)return ' '; return grid[ty][tx]; }
function moveX(o,dx){ o.x+=dx; if(!dx)return false;
  const top=Math.floor(o.y/T), bot=Math.floor((o.y+o.h-1)/T);
  if(dx>0){const tx=Math.floor((o.x+o.w-1)/T);for(let ty=top;ty<=bot;ty++)if(tile(tx,ty)==='#'){o.x=tx*T-o.w;return true;}}
  else{const tx=Math.floor(o.x/T);for(let ty=top;ty<=bot;ty++)if(tile(tx,ty)==='#'){o.x=(tx+1)*T;return true;}}
  return false;}
function moveY(o,dy){ const pb=o.y+o.h; o.y+=dy; o.onGround=false;
  const l=Math.floor(o.x/T), r=Math.floor((o.x+o.w-1)/T);
  if(dy>0){const ty=Math.floor((o.y+o.h-1)/T);
    for(let tx=l;tx<=r;tx++){const c=tile(tx,ty); if(c==='#'||(c==='='&&pb<=ty*T+.5)){o.y=ty*T-o.h;o.vy=0;o.onGround=true;return true;}}}
  else if(dy<0){const ty=Math.floor(o.y/T);for(let tx=l;tx<=r;tx++)if(tile(tx,ty)==='#'){o.y=(ty+1)*T;o.vy=0;return true;}}
  return false;}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function burst(x,y,cols,n=10,heart=false){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*2.5;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,g:.12,life:40+Math.random()*20,heart,s:heart?7:3,c:cols[i%cols.length]});}}

function update(){
  frame++; stT++;
  for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.life--; if(q.sway)q.x+=Math.sin((frame+q.sway)*.05)*.4;}
  particles=particles.filter(q=>q.life>0);
  if(!L||state==='menu'||state==='intro')return;

  if(state==='play'){
    const ax=(keys.right?1:0)-(keys.left?1:0);
    p.vx+=(ax*3.2-p.vx)*.35; if(ax)p.dir=ax;
    p.walkT=(ax&&p.onGround)?p.walkT+1:0;
    p.coy=p.onGround?6:p.coy-1;
    p.buf=keys.jp?8:p.buf-1; keys.jp=false;
    if(p.buf>0&&p.coy>0){p.vy=-11.5;p.buf=0;p.coy=0;sfx.jump();}
    const g=(keys.jump&&p.vy<0)?.45:.8;
    p.vy=Math.min(p.vy+g,12);
    moveX(p,p.vx); moveY(p,p.vy);
    if(p.y>H*T+40)return die();
    // espinas
    const l=Math.floor(p.x/T),r=Math.floor((p.x+p.w-1)/T),tp=Math.floor(p.y/T),bt=Math.floor((p.y+p.h-1)/T);
    for(let ty=tp;ty<=bt;ty++)for(let tx=l;tx<=r;tx++)if(tile(tx,ty)==='^'){
      const sx=tx*T+4,sy=ty*T+14; if(p.x<sx+24&&p.x+p.w>sx&&p.y<sy+18&&p.y+p.h>sy)return die();}
    // corazones
    for(const h of hearts)if(!h.taken&&Math.abs(p.x+10-h.x)<18&&Math.abs(p.y+15-h.y)<22){
      h.taken=true;levelHearts++;sfx.heart();burst(h.x,h.y,['#ff4d7d','#ffb3c7'],8,true);hud();}
  }
  // enemigos
  for(const e of enemies){
    if(!e.alive){e.sq++;continue;}
    e.vy=Math.min(e.vy+.6,12);
    if(moveX(e,e.vx))e.vx*=-1;
    moveY(e,e.vy);
    if(e.onGround){const ax=e.vx>0?e.x+e.w+1:e.x-1,c=tile(Math.floor(ax/T),Math.floor((e.y+e.h+2)/T));if(c!=='#'&&c!=='=')e.vx*=-1;}
    if(e.y>H*T+60){e.alive=false;e.sq=99;}
    if(state==='play'&&overlap(p,e)){
      if(p.vy>0&&(p.y+p.h)-e.y<14){e.alive=false;e.sq=0;p.vy=-8;sfx.stomp();burst(e.x+12,e.y+12,['#b9b4c6','#8f8a9c'],10);}
      else return die();
    }
  }
  if(runner){if(!runner.run&&p.x+p.w>runner.x-150)runner.run=true;if(runner.run){runner.x+=3.4;runner.t++;}}
  if(state==='play'){
    if(flag&&p.x+p.w>flag.x+8&&p.x<flag.x+24)return clearLevel();
    if(him&&p.x+p.w>him.x-50)return startCut();
  }
  if(state==='dead'){p.vy+=.5;p.y+=p.vy; if(stT>75){loadLevel(levelIdx);state='play';}}
  if(state==='clear'){p.vx*=.8;p.vy=Math.min(p.vy+.8,12);moveX(p,p.vx);moveY(p,p.vy);}
  if(state==='cut'||state==='ask'||state==='yes'){
    const target=him.x-32;
    p.vy=Math.min(p.vy+.8,12); moveY(p,p.vy);
    if(!him.kneel){ if(p.x<target-1){p.x+=Math.min(1.8,target-p.x);p.walkT++;p.dir=1;} else {p.x=target;p.walkT=0;him.kneel=true;stT=0;} }
    if(state==='cut'&&him.kneel&&stT>80){state='ask';showAsk();}
    if(state==='yes'&&frame%4===0){const hw=VW/2/cam.z;
      particles.push({x:cam.cx+(Math.random()-.5)*2*hw,y:cam.cy-VH/2/cam.z-10,vx:0,vy:.4+Math.random()*.6,g:0,life:300,heart:true,sway:Math.random()*100,
        s:5+Math.random()*6,c:['#ff4d7d','#ff8fab','#ffd1dc','#e8436e','#ffd34d'][Math.floor(Math.random()*5)]});}
  }
  updateCam();
}
function updateCam(){
  let tz=1,tcx=p.x+10+p.dir*30,tcy=VH/2,k=.15;
  if(state==='cut'||state==='ask'||state==='yes'){tz=2.4;tcx=(p.x+him.x+20)/2;tcy=p.y-4;k=.06;}
  cam.z+=(tz-cam.z)*.05;
  const hw=VW/2/cam.z,hh=VH/2/cam.z;
  cam.cx+=(tcx-cam.cx)*k; cam.cy+=(tcy-cam.cy)*.08;
  cam.cx=clamp(cam.cx,hw,W*T-hw); cam.cy=clamp(cam.cy,hh,H*T-hh);
}
function die(){state='dead';stT=0;attempts++;p.vy=-9;sfx.die();deadMsg=DEATH[Math.floor(Math.random()*DEATH.length)];hud();}
function clearLevel(){state='clear';stT=0;totalHearts+=levelHearts;levelHearts=0;sfx.win();hud();
  burst(flag.x+16,flag.y-30,['#ff4d7d','#ffd34d','#ffffff'],24,true);
  setTimeout(()=>{loadLevel(levelIdx+1);showIntro();},1400);}
function startCut(){state='cut';stT=0;totalHearts+=levelHearts;levelHearts=0;hud();setPlay(false);keys.left=keys.right=keys.jump=false;}

/* ---------- dibujo ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function line(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}
function heart(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s/16,s/16);ctx.beginPath();
  ctx.moveTo(0,6);ctx.bezierCurveTo(-9,0,-9,-8,-4,-8);ctx.bezierCurveTo(-1.5,-8,0,-6,0,-5);
  ctx.bezierCurveTo(0,-6,1.5,-8,4,-8);ctx.bezierCurveTo(9,-8,9,0,0,6);ctx.fillStyle=col;ctx.fill();ctx.restore();}
function star(x,y,s,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#fff';ctx.beginPath();
  for(let i=0;i<8;i++){const r=i%2?s*.3:s,an=i*Math.PI/4;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r);}ctx.fill();ctx.restore();}

function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,L.sky[0]);g.addColorStop(1,L.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='rgba(255,255,255,.55)';circle(VW-70,70,26);
  for(let i=0;i<6;i++){const span=VW+220;const x=(((i*190-cam.cx*.15)%span)+span)%span-110,y=36+(i*47)%100;
    ctx.fillStyle='rgba(255,255,255,.85)';circle(x,y,14);circle(x+16,y-6,18);circle(x+34,y,13);ctx.fillRect(x,y,34,12);}
  hills(.3,'rgba(247,180,200,.8)',VH-120,34,.011);
  hills(.55,'rgba(226,140,170,.85)',VH-80,26,.019);
}
function hills(par,col,base,amp,f){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,VH);
  for(let x=0;x<=VW;x+=8){const w=x+cam.cx*par;ctx.lineTo(x,base+Math.sin(w*f)*amp+Math.sin(w*f*2.3)*amp*.4);}ctx.lineTo(VW,VH);ctx.fill();}

function drawTiles(x0,x1){
  for(let ty=0;ty<H;ty++)for(let tx=x0;tx<=x1;tx++){const c=tile(tx,ty),px=tx*T,py=ty*T;
    if(c==='#'){ctx.fillStyle='#a06d4d';ctx.fillRect(px,py,T,T);
      if(tile(tx,ty-1)!=='#'){ctx.fillStyle='#7cc56b';ctx.fillRect(px,py,T,9);ctx.fillStyle='#5ea94f';ctx.fillRect(px,py+9,T,3);
        if((tx*7+ty)%4===0){ctx.fillStyle='#fff';circle(px+10,py+2,2.5);ctx.fillStyle='#ffd34d';circle(px+10,py+2,1.2);}
        if((tx*5)%7===0){ctx.fillStyle='#ff8fab';circle(px+24,py+3,2.5);}}
      else{ctx.fillStyle='#8c5b3f';circle(px+8+(tx%3)*6,py+14,2);circle(px+22,py+24-(tx%2)*8,1.6);}}
    else if(c==='='){ctx.fillStyle='#f4c38e';rr(px,py,T,12,3);ctx.fill();ctx.fillStyle='#d99b62';ctx.fillRect(px,py+9,T,3);
      ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(px+3,py+2,T-6,2);}
    else if(c==='^'){ctx.fillStyle='#7a2a3f';for(let i=0;i<2;i++){const sx=px+i*16;ctx.beginPath();ctx.moveTo(sx+1,py+T);ctx.lineTo(sx+8,py+12);ctx.lineTo(sx+15,py+T);ctx.fill();}
      ctx.fillStyle='#4f8f43';ctx.fillRect(px,py+T-4,T,4);}
  }
}
function drawFlag(){ if(!flag)return; const x=flag.x+14,gy=flag.y+T;
  ctx.fillStyle='#e9e2d6';ctx.fillRect(x,gy-96,4,96);ctx.fillStyle='#ffd34d';circle(x+2,gy-98,4);
  const w=Math.sin(frame*.12)*2; heart(x+18,gy-80+w,26,'#ff4d7d');}
function drawArch(){ if(!him)return; const cx=him.x+10, gy=him.y+30;
  ctx.strokeStyle='#6fb45f';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx-34,gy);ctx.lineTo(cx-34,gy-36);ctx.arc(cx,gy-36,34,Math.PI,0);ctx.lineTo(cx+34,gy);ctx.stroke();
  for(let i=0;i<=10;i++){const a=Math.PI+i*Math.PI/10;ctx.fillStyle=i%2?'#ff8fab':'#fff';circle(cx+Math.cos(a)*34,gy-36+Math.sin(a)*34,3.5);}
  for(let i=0;i<3;i++){ctx.fillStyle=i%2?'#fff':'#ff8fab';circle(cx-34,gy-8-i*12,3);circle(cx+34,gy-8-i*12,3);}}

function drawPerson(x,y,isGirl,dir,o={}){
  const img=isGirl?faces.g:faces.b, cx=x+10, k=o.kneel?7:0;
  const sw=o.walk?Math.sin(o.walk*.35)*5:0;
  if(o.hop)y-=Math.abs(Math.sin(frame*.15))*10;
  ctx.lineCap='round';
  if(isGirl){ctx.strokeStyle='#f1c1a0';ctx.lineWidth=4;line(cx-3,y+22,cx-3+sw,y+30);line(cx+3,y+22,cx+3-sw,y+30);}
  else if(o.kneel){ctx.strokeStyle='#27406a';ctx.lineWidth=5;
    line(cx-dir*2,y+24,cx-dir*9,y+30);line(cx-dir*9,y+30,cx-dir*17,y+30);
    line(cx+dir*2,y+24,cx+dir*9,y+24);line(cx+dir*9,y+24,cx+dir*9,y+30);}
  else{ctx.strokeStyle='#27406a';ctx.lineWidth=5;line(cx-3,y+21,cx-3+sw,y+30);line(cx+3,y+21,cx+3-sw,y+30);}
  if(isGirl){ctx.fillStyle='#ef5a86';ctx.beginPath();ctx.moveTo(cx-5,y+11);ctx.lineTo(cx+5,y+11);ctx.lineTo(cx+12,y+25);ctx.lineTo(cx-12,y+25);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(cx-6,y+15,12,2);}
  else{ctx.fillStyle='#3b7bea';rr(cx-7,y+11+k,14,13,4);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(cx-2,y+11+k);ctx.lineTo(cx+2,y+11+k);ctx.lineTo(cx,y+15+k);ctx.fill();}
  ctx.strokeStyle=isGirl?'#f1c1a0':'#3b7bea';ctx.lineWidth=4;
  if(o.offer){line(cx+dir*4,y+15+k,cx+dir*15,y+12+k);line(cx-dir*5,y+14+k,cx-dir*6,y+22+k);}
  else if(o.cheer){line(cx-5,y+13,cx-11,y+4);line(cx+5,y+13,cx+11,y+4);}
  else{line(cx-5,y+14+k,cx-7-sw*.6,y+22+k);line(cx+5,y+14+k,cx+7+sw*.6,y+22+k);}
  const hy=y+1+k,r=13;
  if(isGirl&&!img){ctx.fillStyle='#6b3a24';rr(cx-14,hy-7,28,26,11);ctx.fill();}
  if(img){ctx.save();ctx.beginPath();ctx.arc(cx,hy,r,0,Math.PI*2);ctx.clip();ctx.drawImage(img,cx-r,hy-r,r*2,r*2);ctx.restore();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,hy,r,0,Math.PI*2);ctx.stroke();}
  else{ctx.fillStyle='#f6cba8';circle(cx,hy,r);
    ctx.fillStyle=isGirl?'#6b3a24':'#3a2418';ctx.beginPath();ctx.arc(cx,hy-1,r+.5,Math.PI*1.02,Math.PI*1.98);ctx.fill();
    ctx.fillStyle='#2b1a14';circle(cx-4+dir*2,hy+2,1.9);circle(cx+4+dir*2,hy+2,1.9);
    ctx.fillStyle='rgba(255,110,140,.45)';circle(cx-7+dir*2,hy+6,2.3);circle(cx+7+dir*2,hy+6,2.3);
    ctx.strokeStyle='#2b1a14';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx+dir*2,hy+5,3,.15*Math.PI,.85*Math.PI);ctx.stroke();}
  if(isGirl){for(let i=0;i<5;i++){const a=i*Math.PI*2/5;ctx.fillStyle='#fff';circle(cx-dir*9+Math.cos(a)*3.2,hy-9+Math.sin(a)*3.2,2.3);}
    ctx.fillStyle='#ffd34d';circle(cx-dir*9,hy-9,1.8);}
}
function drawRing(x,y){ctx.fillStyle='#c81d4e';rr(x-6,y-1,12,8,2);ctx.fill();ctx.fillStyle='#8f1236';ctx.fillRect(x-6,y-1,12,2);
  ctx.strokeStyle='#ffd34d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-5,3.5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#dff6ff';ctx.beginPath();ctx.moveTo(x,y-14);ctx.lineTo(x+3,y-11);ctx.lineTo(x,y-8);ctx.lineTo(x-3,y-11);ctx.fill();
  star(x+6,y-15,3+Math.sin(frame*.2)*1.5,frame*.05);star(x-7,y-10,2+Math.cos(frame*.25),-frame*.05);}
function drawDuda(e){
  if(!e.alive){if(e.sq>20)return;ctx.globalAlpha=1-e.sq/20;ctx.fillStyle='#8f8a9c';ctx.beginPath();ctx.ellipse(e.x+12,e.y+19,14,4,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;return;}
  const bx=e.x+12,by=e.y+12,w=Math.sin(frame*.25+e.x)*1.2;
  ctx.fillStyle='#6f6a7c';circle(bx-6,e.y+20,4);circle(bx+6,e.y+20,4);
  ctx.fillStyle='#8f8a9c';ctx.beginPath();ctx.ellipse(bx,by+1,13,11+w,0,0,Math.PI*2);ctx.fill();
  const d=e.vx>0?2:-2;ctx.fillStyle='#fff';circle(bx-5+d,by,3.6);circle(bx+5+d,by,3.6);
  ctx.fillStyle='#2b1a14';circle(bx-5+d*1.5,by+1,1.8);circle(bx+5+d*1.5,by+1,1.8);
  ctx.strokeStyle='#2b1a14';ctx.lineWidth=2;line(bx-9+d,by-6,bx-2+d,by-3);line(bx+9+d,by-6,bx+2+d,by-3);
  ctx.fillStyle='#fff';ctx.font='800 14px "Baloo 2",system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('?',bx,e.y-6+Math.sin(frame*.1+e.x)*2);}

function drawRunner(){const r=runner;drawPerson(r.x,r.y,false,1,{walk:r.run?r.t:0});
  const t=r.run?'¡Atrápame! 😜':'¿Me buscabas?';ctx.font='700 11px "Baloo 2",system-ui,sans-serif';ctx.textAlign='center';
  const w=ctx.measureText(t).width+12,bx=r.x+10,by=r.y-30;ctx.fillStyle='rgba(255,255,255,.92)';rr(bx-w/2,by-11,w,17,8);ctx.fill();
  ctx.fillStyle='#3b1f2b';ctx.fillText(t,bx,by+2);}
function banner(t,s){ctx.save();ctx.textAlign='center';ctx.lineJoin='round';
  ctx.font='800 32px "Baloo 2",system-ui,sans-serif';ctx.lineWidth=7;ctx.strokeStyle='rgba(90,15,45,.65)';ctx.strokeText(t,VW/2,VH/2-8);ctx.fillStyle='#fff';ctx.fillText(t,VW/2,VH/2-8);
  if(s){ctx.font='700 18px "Baloo 2",system-ui,sans-serif';ctx.lineWidth=5;ctx.strokeText(s,VW/2,VH/2+22);ctx.fillText(s,VW/2,VH/2+22);}ctx.restore();}

function draw(){
  ctx.setTransform(S,0,0,S,0,0);
  if(!L){ctx.fillStyle='#bfe3ff';ctx.fillRect(0,0,VW,VH);return;}
  drawBg();
  ctx.save();ctx.translate(VW/2,VH/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.cx,-cam.cy);
  const hw=VW/2/cam.z;drawTiles(Math.floor((cam.cx-hw)/T)-1,Math.ceil((cam.cx+hw)/T)+1);
  drawFlag();drawArch();
  for(const h of hearts)if(!h.taken){heart(h.x,h.y+Math.sin(frame*.08+h.x)*3,18,'#ff4d7d');ctx.fillStyle='rgba(255,255,255,.7)';circle(h.x-3,h.y-3+Math.sin(frame*.08+h.x)*3,1.8);}
  for(const e of enemies)drawDuda(e);
  const ending=state==='cut'||state==='ask'||state==='yes';
  if(him)drawPerson(him.x,him.y,false,-1,{kneel:him.kneel,offer:him.kneel&&ending});
  if(runner)drawRunner();
  if(state==='dead')ctx.globalAlpha=.75;
  drawPerson(p.x,p.y,true,p.dir,{walk:p.walkT,hop:state==='yes',cheer:state==='yes'});
  ctx.globalAlpha=1;
  if(him&&him.kneel&&ending&&stT>25)drawRing(him.x-7,him.y+11);
  if(him&&state==='play'&&frame%90<45)heart(him.x+10,him.y-22-(frame%90)*.3,10,'rgba(255,77,125,.8)');
  if(state==='yes'){heart(p.x+10,p.y-30+Math.sin(frame*.1)*3,14,'#ff4d7d');}
  for(const q of particles){ctx.globalAlpha=Math.min(1,q.life/20);if(q.heart)heart(q.x,q.y,q.s*2,q.c);else{ctx.fillStyle=q.c;circle(q.x,q.y,q.s);}}
  ctx.globalAlpha=1;ctx.restore();
  if(state==='dead')banner('¡Ay!',deadMsg);
  if(state==='clear')banner('¡Nivel superado!','Se te escapó… ¡a por él!');
}

  const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}press(k,true);b.classList.add('on');};
  const off=()=>{press(k,false);b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);
  b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault());});

function readPhoto(file,k){if(!file)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const s=180,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(im.width,im.height);
  x.drawImage(im,(im.width-m)/2,(im.height-m)/2*0.6,m,m,0,0,s,s);const url=c.toDataURL('image/jpeg',.85);
  cfg[k==='b'?'boyFace':'girlFace']=url;saveCfg();setFaceImg(k,url);};im.src=fr.result;};fr.readAsDataURL(file);}

function showMenu(){stopMusic();state='menu';if(!L)loadLevel(0);showOv(`
  <h1>Camino al Sí 💍</h1>
  <p class="sub">María José tiene que superar los tres niveles, cueste lo que cueste, para alcanzar a Jona… y que por fin le pida matrimonio.</p>
  <div class="duo">${whoBox('g','María José','👰')}${whoBox('b','Jona','🤵')}</div>
  <button class="big" id="go">Empezar la aventura</button>
  <p class="hint">Recoge corazones, salta encima de las “dudas” para quitarlas de en medio y cuidado con las espinas.</p>`);
  refreshPreviews();
  $('#go').onclick=startGame;
}
function startGame(){playMusic(BRIDAL,92);attempts=0;totalHearts=0;loadLevel(0);showIntro();}
function showIntro(){state='intro';showOv(`
  <span class="tag">Nivel ${levelIdx+1} de ${LEVELS.length}</span>
  <h2>${L.name}</h2>
  <p class="quote">${L.msg(cfg)}</p>
  <button class="big" id="go">¡Vamos!</button>`);
  $('#go').onclick=()=>{hideOv();state='play';setPlay(true);keys.jp=false;};}
function showAsk(){let no=0;showOv(`
  <p class="sub">${esc(cfg.boy)} se arrodilla y saca un anillo…</p>
  <h2>“${esc(cfg.girl)}, ¿quieres casarte conmigo?”</h2>
  <div class="row"><button class="big" id="yes">¡Sí, quiero! 💍</button><button class="ghost" id="no">No</button></div>`,true);
  const yes=()=>{state='yes';stT=0;playMusic(FANFARE+BRIDAL,126,24);burst(him.x+10,him.y,['#ff4d7d','#ffd34d','#fff','#ff8fab'],40,true);hideOv();setTimeout(showWin,1800);};
  $('#yes').onclick=yes;
  const nb=$('#no'),txt=['¿Seguro? 🥺','Piénsalo bien…','¡Eso no vale!'];
  const run=e=>{if(no>=3)return;e&&e.preventDefault();no++;
    nb.style.transform=`translate(${(Math.random()-.5)*160}px,${(Math.random()-.5)*50}px)`;
    if(no>=3){nb.textContent='¡Vale, SÍ! 😍';nb.style.transform='';nb.className='big';}else nb.textContent=txt[no-1];};
  nb.addEventListener('pointerdown',e=>{if(no<3)run(e);});
  nb.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')run(e);});
  nb.addEventListener('click',e=>{if(no>=3)yes();else e.preventDefault();});}
function showWin(){showOv(`
  <h1>¡Dijo que sí! 💍</h1>
  <p>${esc(cfg.girl)} alcanzó a ${esc(cfg.boy)} a toda costa: ${totalHearts} corazones recogidos y ${attempts} ${attempts===1?'caída':'caídas'} por el camino.</p>
  <div class="row"><button class="big" id="again">Jugar otra vez</button><button class="ghost" id="menu">Volver a la portada</button></div>`,true);
  $('#again').onclick=startGame;$('#menu').onclick=showMenu;}
$('#home').onclick=showMenu;

/* ---------- tamaño ---------- */
const stage=$('#stage');
function fit(){const aw=stage.clientWidth,ah=stage.clientHeight;let w=aw,h=w*VH/VW;if(h>ah){h=ah;w=h*VW/VH;}cv.style.width=w+'px';cv.style.height=h+'px';}
addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);fit();

loadLevel(0);showMenu();requestAnimationFrame(loop);
})();
</script>
</body>
